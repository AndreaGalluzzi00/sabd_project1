# Override OPZIONALE: aggiunge 2 datanode (totale 3) per dimostrare
# la replica automatica di HDFS.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.datanodes.yml up -d
#
# NON usare per i benchmark di timing: 3 datanode sulla stessa macchina
# competono per CPU/IO e falsano i tempi. Per i timing usa il solo
# docker-compose.yml (1 datanode, replica 1).
services:
  datanode2:
    image: bde2020/hadoop-datanode:${HADOOP_IMAGE_VERSION}
    platform: ${PLATFORM}
    container_name: datanode2
    hostname: datanode2
    restart: unless-stopped
    volumes:
      - hdfs_datanode2:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./hadoop.env
    depends_on:
      - namenode
    networks: [sabd-net]

  datanode3:
    image: bde2020/hadoop-datanode:${HADOOP_IMAGE_VERSION}
    platform: ${PLATFORM}
    container_name: datanode3
    hostname: datanode3
    restart: unless-stopped
    volumes:
      - hdfs_datanode3:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./hadoop.env
    depends_on:
      - namenode
    networks: [sabd-net]

volumes:
  hdfs_datanode2:
  hdfs_datanode3:
